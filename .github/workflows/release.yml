name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows Installers
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare verified Mihomo core binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIHOMO_VERSION: v1.19.29
        run: node scripts/prepare-mihomo.mjs

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Build application bundles
        run: npm run build

      - name: Package Windows Setup & Portable installers
        run: npx --no-install electron-builder --win nsis portable --publish never

      - name: Generate SHASUMS256.txt and Release Notes
        shell: pwsh
        run: |
          $relDir = (Resolve-Path 'release').Path
          $setupPath = 'release\Windows-NexLink-Setup.exe'
          $portablePath = 'release\Windows-NexLink-Portable.exe'
          foreach ($file in @($setupPath, $portablePath)) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Expected release artifact missing: $file"
            }
          }
          $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -LiteralPath $portablePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaLines = @(
            "$setupHash  Windows-NexLink-Setup.exe",
            "$portableHash  Windows-NexLink-Portable.exe"
          )
          $outPath = Join-Path $relDir 'SHASUMS256.txt'
          [System.IO.File]::WriteAllText($outPath, ($shaLines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath $outPath

          $tag = $env:GITHUB_REF_NAME
          if (-not $tag) { $tag = 'manual' }
          $shortSha = (git rev-parse --short HEAD).Trim()
          $isPre = $tag.Contains('-')
          $releaseKind = if ($isPre) { '测试版（Pre-release）' } else { '正式发布' }

          $prevTag = (git tag --sort=-v:refname | Where-Object { $_ -ne $tag -and $_ -like 'v*' } | Select-Object -First 1)
          if ($prevTag) {
            $commits = @(git log "$prevTag..HEAD" --no-merges --pretty=format:'- %s (%h)' | Where-Object { $_ })
          } else {
            $commits = @(git log -n 10 --no-merges --pretty=format:'- %s (%h)' | Where-Object { $_ })
          }
          if (-not $commits -or $commits.Count -eq 0) {
            $commits = @("- 例行版本构建 ($shortSha)")
          }

          $notes = @(
            "NexLink $tag $releaseKind（基于提交 ``$shortSha`` 构建）。",
            "",
            "### 更新内容",
            ($commits -join "`n"),
            "",
            "### 产物与 SHA-256 校验",
            "- **安装版**: ``Windows-NexLink-Setup.exe`` (``$setupHash``)",
            "- **便携版**: ``Windows-NexLink-Portable.exe`` (``$portableHash``)",
            "- **校验清单**: ``SHASUMS256.txt``"
          )
          if ($prevTag) {
            $notes += ""
            $notes += "**完整变更对比**: https://github.com/$($env:GITHUB_REPOSITORY)/compare/$prevTag...$tag"
          }
          $notesPath = Join-Path $relDir 'RELEASE_NOTES.md'
          [System.IO.File]::WriteAllText($notesPath, ($notes -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: Upload workflow build artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexlink-windows-installers
          path: |
            release/Windows-NexLink-Setup.exe
            release/Windows-NexLink-Portable.exe
            release/SHASUMS256.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: NexLink ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/Windows-NexLink-Setup.exe
            release/Windows-NexLink-Portable.exe
            release/SHASUMS256.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
